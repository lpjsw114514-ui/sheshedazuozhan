<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蛇蛇大作战 - 正在更新中</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #0b1120;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }

  .card {
    background: #1e293b;
    padding: 40px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
    width: 400px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* 顶部Logo与发光效果 */
  .logo {
    font-size: 60px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 15px rgba(163, 230, 53, 0.6));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* 标题 */
  .title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 15px;
    background: linear-gradient(90deg, #4ade80, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* 文字说明 */
  .desc-main {
    font-size: 16px;
    color: #cbd5e1;
    margin-bottom: 10px;
  }

  .desc-sub {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 30px;
  }

  /* 贪吃蛇加载条 */
  .snake-loader {
    width: 100%;
    height: 20px;
    background: #0f172a;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    margin-bottom: 30px;
    border: 1px solid #334155;
  }

  /* 进度条上的豆子 */
  .snake-loader::before {
    content: '••••••••';
    position: absolute;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    color: #475569;
    letter-spacing: 5px;
  }

  /* 爬行的贪吃蛇 */
  .snake {
    width: 30px;
    height: 14px;
    background: #a3e635;
    border-radius: 4px;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 10px #a3e635;
    animation: crawl 3s linear infinite;
  }

  /* 蛇头 */
  .snake::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 2px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 6px solid #a3e635;
  }

  @keyframes crawl {
    0% { left: 0%; }
    100% { left: 100%; }
  }

  /* 禁用状态的按钮 */
  .btn-disabled {
    background: #334155;
    color: #94a3b8;
    padding: 14px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    cursor: not-allowed;
    user-select: none;
  }

</style>
</head>
<body>

<div class="card">
  <div class="logo">🐍</div>
  <div class="title">系统更新中...</div>
  <div class="desc-main">网站正在更新中，期间暂时无法访问</div>
  <div class="desc-sub">我们正在努力为您提供更好的服务，敬请期待</div>
  
  <!-- 加载条区域 -->
  <div class="snake-loader">
    <div class="snake"></div>
  </div>

  <!-- 替代原有“进入游戏”按钮 -->
  <div class="btn-disabled">维护中，请稍后再来</div>
</div>

</body>
</html>
